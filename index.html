<!DOCTYPE html>
<html lang="en" dir="ltr"> <!-- यहाँ dir="ltr" कर दिया है ताकि इंग्लिश टेक्स्ट सही दिखे -->
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mister G Official</title>
    <style>
        body {
            margin: 0; padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #2c3e50; /* फिलहाल बैकग्राउंड कलर दिया है, बाद में फोटो लिंक लगा लें */
            background-size: cover;
            display: flex; justify-content: center; align-items: center;
            min-height: 100vh;
        }
        .overlay { background: rgba(0, 0, 0, 0.7); position: absolute; width: 100%; height: 100%; z-index: 1; }
        
        .main-card {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(15px);
            padding: 30px; border-radius: 30px;
            text-align: center; width: 90%; max-width: 450px;
            z-index: 2; color: white; border: 2px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .description {
            font-size: 15px;
            line-height: 1.6;
            margin-bottom: 20px;
            color: #eee;
        }

        .btn {
            display: block; padding: 15px; margin: 12px 0;
            text-decoration: none; color: white; font-weight: bold;
            border-radius: 50px; transition: 0.4s; border: 2px solid white;
            text-align: center; /* टेक्स्ट को सेंटर करने के लिए */
        }
        .yt { background: #ff0000; }
        .yt:hover { background: #cc0000; }
    </style>
</head>
<body>
    <div class="overlay"></div>

    <div class="main-card">
        <h1>Mister-G</h1>
        <p class="description">
            Official Portfolio of Mister-G: 🎮 Pro Free Fire Gameplay, HD Photo Editing, and Custom Music/Rap Production. Looking for top-quality creative work? I provide professional editing and music services that you can easily order. Explore my work and let's collaborate!
        </p>
        
        <!-- यहाँ अपना असली YouTube लिंक लगाएं -->
        <a href="https://www.youtube.com/@YOUR_CHANNEL_ID" class="btn yt">YouTube چینل</a>
    </div>
</body>
</html>

<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mister G Official</title>
    <style>
        body {
            margin: 0; padding: 0;
            font-family: 'Arial', sans-serif;
            /* اپنی تصویر کا لنک یہاں لگائیں */
            background: url('https://i.imgur.com/YOUR_IMAGE_LINK.jpg') no-repeat center center fixed;
            background-size: cover;
            display: flex; justify-content: center; align-items: center;
            min-height: 100vh;
        }
        .overlay { background: rgba(0, 0, 0, 0.7); position: absolute; width: 100%; height: 100%; z-index: 1; }
        
        .main-card {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(15px);
            padding: 30px; border-radius: 30px;
            text-align: center; width: 90%; max-width: 450px;
            z-index: 2; color: white; border: 2px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .description {
            font-size: 15px;
            line-height: 1.6;
            margin-bottom: 20px;
            color: #eee;
        }

        .img-grid { display: flex; justify-content: space-between; margin-bottom: 20px; }
        .grid-img { width: 30%; border-radius: 10px; border: 2px solid #fff; }

        .btn {
            display: block; padding: 15px; margin: 12px 0;
            text-decoration: none; color: white; font-weight: bold;
            border-radius: 50px; transition: 0.4s; border: 2px solid white;
        }
        .yt { background: #ff0000; }
    </style>
</head>
<body>
    <div class="overlay"></div>

    <div class="main-card">
        <h1>Mister-G</h1>
        <p class="description">
            Official Portfolio of Mister-G: 🎮 Pro Free Fire Gameplay, HD Photo Editing, and Custom Music/Rap Production. Looking for top-quality creative work? I provide professional editing and music services that you can easily order. Explore my work and let's collaborate!
        </p>
        
        <!-- یہاں اپنے بٹنز شامل کریں -->
        <a href="#" class="btn yt">YouTube چینل</a>
    </div>
</body>
</html>
